server {
    listen 80;
    listen [::]:80;
    server_name vumbua.co.ke www.vumbua.co.ke;
    return 301 https://vumbua.co.ke$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vumbua.co.ke;

    ssl_certificate /etc/letsencrypt/live/vumbua.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vumbua.co.ke/privkey.pem;

    return 301 https://vumbua.co.ke$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vumbua.co.ke;

    ssl_certificate /etc/letsencrypt/live/vumbua.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vumbua.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VumbuaTLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 16k;

    location /static/ {
        alias /srv/vumbua/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
