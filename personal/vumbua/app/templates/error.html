{% extends "base.html" %}
{% block title %}{{ code }} — Vumbua{% endblock %}
{% block content %}
<section class="error-section">
  <div class="content-width">
    <p class="eyebrow">{{ "%03d"|format(code) }} / Vumbua</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="button button-blue" href="{{ url_for('pages.home') }}">Back to the home page <span>↗</span></a>
  </div>
</section>
{% endblock %}
