  <text x="54" y="66" fill="#a5b4fc" font-family="monospace" font-size="22">Data Cleaning Pipeline</text>
  <rect x="54" y="90" width="792" height="2" fill="#334155"/>
  <text x="54" y="136" fill="#93c5fd" font-family="monospace" font-size="21">df.columns = df.columns.str.lower()</text>
  <text x="54" y="170" fill="#86efac" font-family="monospace" font-size="21">df = df.dropna(subset=['amount'])</text>
  <text x="54" y="204" fill="#fca5a5" font-family="monospace" font-size="21">df['date'] = pd.to_datetime(df['date'])</text>
  <text x="54" y="238" fill="#fcd34d" font-family="monospace" font-size="21">df['month'] = df['date'].dt.to_period('M')</text>
